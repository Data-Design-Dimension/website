body: |
  ## What it was

  A static thematic map for Citizen Diplomacy International of Philadelphia's annual fundraising campaign. It anchored the postal mail and email appeals, and was featured on cdiphila.org to drive visitors to a donation page during the campaign window. (CDIPHL has since been merged with the World Affairs Council of Philadelphia.)

  ## Impact

  Debrief uncovered that the campaign raised more than the highest preceding year's campaign, at an earlier response rate. The map was the visual anchor for that lift. The kickoff interview shaped the tone: urgency for constituents from nations where the programs remain critical to human rights.

  ## How it's Made

  QGIS for the geospatial layout, Adobe tools for design polish, exported in formats sized for both print production and fast web / mobile delivery. Independent states were rendered per the U.S. Department of State's Bureau of Intelligence and Research [Independent States in the World list](https://www.state.gov/independent-states-in-the-world/) at the time, a data source produced by a key partner of the client, so the diplomatic visual context aligned with the client.

  ## What I'd do differently

  A Winkel Tripel projection would let viewers interpret distance and area more accurately than the equirectangular default. Cartographic projection is a substance choice, not a stylistic one: every map foregrounds something and distorts something else.
