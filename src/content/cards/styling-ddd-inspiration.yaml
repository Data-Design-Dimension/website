type: inspiration
title: Visual Inspiration
summary: "Mood board: Philadelphia industrial typography, embossed cast iron, found vernacular signage. Plus the design DNA of the cards themselves, drawn from vintage CRT tube televisions: bezel, asymmetric pillow shape, screen bulge, phosphor glow. Pre-flat-screen object design as a reference for tactile, dimensional digital surfaces."
