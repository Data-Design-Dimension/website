body: |
  I researched and wrote a survey of noteworthy global data visualization projects and practitioners across a myriad of fields approaching sustainability through diverse lenses, from soil to water, local to across geopolitical bounds, and installations experienced in person to dashboards promoting accountability in development goals. This topic was close to home for me as a tree hugger at heart.
