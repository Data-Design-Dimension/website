body: |
  ## What it was

  A high-fidelity Tableau Story prototype for a Philadelphia Streets Department budget proposal to City Council. One dataset, two audiences: council members with vote-swaying power, and residents whose engagement closes the loop on litter control.

  Best viewed on a computer; the layout is sized for the data-dense presentation use case, not mobile.

  ## Personas

  Empathy for the constraints both audiences operate under was the design's center. The council-side persona drew from research on Hon. Curtis Jones Jr. as a community-informed development advocate. The resident-side persona drove the at-a-glance placards for shop windows, sidewalk trash bins, and transit.

  Full archetype work: [view the persona development PDF](/work/invest-as-one-persona-development.pdf).

  ## Layout choices

  Charts top-and-left in each section, following the F-shaped reading pattern that eye-tracking research surfaces for data-dense layouts. Each section pulled one key point: spending breakdown, cost projections, marketing briefs. Visual hierarchy and short text chunks supported scanning over deep reading.

  Surveys informed the at-a-glance placards. Council deck and field signage read from the same data spine; only the framing changed per audience.
