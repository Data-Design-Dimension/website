body: |
  A once editorial committee member, I continue to write and edit articles for this professional society publication focused on data visualization but extending to sonification and an expansive view of the field. As a freelance editor, I enjoy getting to know peers, helping them to articulate their voice, and being the first to read and learn from new content and ideas.
